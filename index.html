<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecretRecipe Cloud — Restoran & Menyu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Arxa fonda peşəkar mətbəx şəkli və tünd qradiyent örtük */
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                        url('https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #333;
            min-height: 100vh;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        header {
            background: rgba(211, 84, 0, 0.9);
            color: white;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            border-bottom: 3px solid #f39c12;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            opacity: 0.95;
            font-size: 1.1rem;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .section-title {
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 15px;
            border-bottom: 2px solid #e67e22;
            padding-bottom: 8px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        /* Menyu Kartları */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .menu-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(230, 126, 34, 0.4);
        }

        .menu-item h3 {
            font-size: 1.15rem;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .menu-item .price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #d35400;
            margin: 10px 0;
        }

        .add-btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s, transform 0.1s;
        }

        .add-btn:hover {
            background: linear-gradient(135deg, #219150, #27ae60);
            transform: scale(1.02);
        }

        .add-btn:active {
            transform: scale(0.98);
        }

        /* Səbət Panel */
        .cart-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            height: fit-content;
            position: sticky;
            top: 20px;
            backdrop-filter: blur(10px);
        }

        .cart-card .section-title {
            color: #2c3e50;
            border-color: #27ae60;
        }

        .cart-items {
            list-style: none;
            margin-bottom: 15px;
            max-height: 250px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }

        .cart-total {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: right;
            margin: 15px 0;
            color: #2c3e50;
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
        }

        .checkout-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* Secret Recipe Vault */
        .vault-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            margin-top: 25px;
            backdrop-filter: blur(10px);
        }

        .vault-card .section-title {
            color: #2c3e50;
            border-color: #8e44ad;
        }

        .vault-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }

        .vault-btn {
            width: 100%;
            background: linear-gradient(135deg, #8e44ad, #9b59b6);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .vault-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1>🍽️ SecretRecipe Cloud Restaurant</h1>
        <p>Bulud texnologiyası ilə qorunan ləzzətli menyu və gizli reseptlər</p>
    </header>

    <div class="container">
        <!-- Sol tərəf: Menyu və Vault -->
        <div>
            <h2 class="section-title">✨ Restoran Menyusu</h2>
            <div class="menu-grid" id="menu-container">
                <!-- JavaScript ilə dolacaq -->
            </div>

            <div class="vault-card">
                <h2 class="section-title">🔐 Chef's Secret Vault (Məxfi Kod)</h2>
                <p style="margin-bottom: 12px; font-size: 0.9rem; color: #555;">Xüsusi aşpaz kodunu daxil edərək gizli şah əsərini açın (Kod: <code>1234</code>):</p>
                <input type="password" id="secretCode" placeholder="Məxfi kodu daxil edin...">
                <button class="vault-btn" onclick="checkSecretCode()">Gizli Resepti Aç</button>
            </div>
        </div>

        <!-- Sağ tərəf: Səbət -->
        <div class="cart-card">
            <h2 class="section-title">🛒 Sizin Sifariş</h2>
            <ul class="cart-items" id="cart-list">
                <li style="color: #999; text-align: center; padding: 20px;">Səbət boşdur</li>
            </ul>
            <div class="cart-total">Cəmi: <span id="total-price">0.00</span> AZN</div>
            <button class="checkout-btn" onclick="completeOrder()">Sifarişi Təsdiqlə</button>
        </div>
    </div>

    <script>
        const menuItems = [
            { id: 1, name: "Dadlı Lülə Kabab", price: 8.50 },
            { id: 2, name: "Məxsuşi Tikə Kabab", price: 9.00 },
            { id: 3, name: "Toyuq Çığırtması", price: 7.00 },
            { id: 4, name: "Paytaxt Salat", price: 4.50 },
            { id: 5, name: "Təbii Nar Şirəsi", price: 3.00 },
            { id: 6, name: "Paxlava (1 ədəd)", price: 2.50 }
        ];

        let cart = [];

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            
            menuItems.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('menu-item');
                card.innerHTML = `
                    <h3>${item.name}</h3>
                    <div class="price">${item.price.toFixed(2)} AZN</div>
                    <button class="add-btn" onclick="addToCart(${item.id})">+ Səbətə Əlavə Et</button>
                `;
                container.appendChild(card);
            });
        }

        function addToCart(id) {
            const product = menuItems.find(p => p.id === id);
            cart.push(product);
            updateCart();
        }

        function updateCart() {
            const list = document.getElementById('cart-list');
            const totalSpan = document.getElementById('total-price');
            
            if (cart.length === 0) {
                list.innerHTML = '<li style="color: #999; text-align: center; padding: 20px;">Səbət boşdur</li>';
                totalSpan.innerText = '0.00';
                return;
            }

            list.innerHTML = '';
            let total = 0;

            cart.forEach((item) => {
                total += item.price;
                const li = document.createElement('li');
                li.classList.add('cart-item');
                li.innerHTML = `
                    <span>${item.name}</span>
                    <span><strong>${item.price.toFixed(2)} AZN</strong></span>
                `;
                list.appendChild(li);
            });

            totalSpan.innerText = total.toFixed(2);
        }

        function completeOrder() {
            if (cart.length === 0) {
                alert("Zəhmət olmasa əvvəlcə menyudan yemək seçin!");
                return;
            }
            alert("Təbrik edirik! Sifarişiniz qəbul olundu. Tezliklə hazırlanacaq.");
            cart = [];
            updateCart();
        }

        function checkSecretCode() {
            const code = document.getElementById('secretCode').value;
            if (code === "1234" || code === "secret") {
                alert("🎉 Məxfi Resept Açıldı: 'Şefin Xüsusi Şah Plavı' menyunuza pulsuz əlavə olundu!");
                cart.push({ id: 99, name: "🌟 Şefin Xüsusi Şah Plavı (Məxfi)", price: 0.00 });
                updateCart();
                document.getElementById('secretCode').value = '';
            } else {
                alert("❌ Yanlış məxfi kod! Yenidən cəhd edin (ipucu: 1234).");
            }
        }

        renderMenu();
    </script>
</body>
</html>
