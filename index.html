<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecretRecipe Cloud — Məxfi Reseptlər və Restoran</title>
    <!-- CryptoJS (AES-256 və SHA-256 Kriptoqrafiya üçün) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), 
                        url('https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover; color: #333; min-height: 100vh;
            animation: fadeInBody 1.2s ease-in-out;
        }
        @keyframes fadeInBody { from { opacity: 0; } to { opacity: 1; } }

        header { 
            background: rgba(211, 84, 0, 0.95); color: white; padding: 35px; text-align: center; 
            border-bottom: 4px solid #f39c12; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            animation: slideDown 0.8s ease-out;
        }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        header h1 { font-size: 2.2rem; margin-bottom: 8px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

        .section-title { font-size: 1.4rem; color: #fff; margin-bottom: 15px; border-bottom: 2px solid #e67e22; padding-bottom: 8px; }
        
        /* Menyu Grid və Animasiyalı Kartlar */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .menu-item {
            background: rgba(255, 255, 255, 0.95); border-radius: 12px; overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2); transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: popUp 0.5s ease backwards;
        }
        .menu-item:hover { transform: translateY(-8px); box-shadow: 0 12px 30px rgba(243, 156, 18, 0.4); }
        @keyframes popUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .menu-img { width: 100%; height: 150px; object-fit: cover; transition: transform 0.5s ease; }
        .menu-item:hover .menu-img { transform: scale(1.08); }

        .menu-content { padding: 15px; }
        .menu-item h3 { color: #2c3e50; font-size: 1.15rem; margin-bottom: 5px; }
        .menu-item .price { font-size: 1.2rem; font-weight: bold; color: #d35400; margin: 10px 0; }

        .btn { 
            background: #27ae60; color: white; border: none; padding: 10px; border-radius: 8px; 
            cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s, transform 0.1s; 
        }
        .btn:hover { background: #219653; }
        .btn:active { transform: scale(0.98); }
        .btn-purple { background: #8e44ad; }
        .btn-purple:hover { background: #732d91; }

        .cart-card, .vault-card { 
            background: rgba(255, 255, 255, 0.95); border-radius: 12px; padding: 20px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.2); margin-bottom: 25px;
        }
        .cart-card .section-title, .vault-card .section-title { color: #2c3e50; }
        .cart-items { list-style: none; margin-bottom: 15px; max-height: 200px; overflow-y: auto; }
        .cart-item { 
            display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        input, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
        input:focus, textarea:focus { border-color: #8e44ad; outline: none; box-shadow: 0 0 5px rgba(142,68,173,0.4); }

        .crypto-box { 
            background: #f8f9fa; padding: 12px; border-radius: 6px; font-family: monospace; 
            font-size: 0.85rem; word-break: break-all; margin-top: 10px; border-left: 4px solid #8e44ad;
            animation: fadeIn 0.4s ease;
        }
    </style>
</head>
<body>

    <header>
        <h1>🍽️ SecretRecipe Cloud Restaurant</h1>
        <p>İkiqat Kriptoqrafiya (AES-256 + SHA-256) və Supabase Təhlükəsizliyi</p>
    </header>

    <div class="container">
        <div>
            <h2 class="section-title">✨ Restoran Menyusu</h2>
            <div class="menu-grid" id="menu-container"></div>

            <!-- Kriptoqrafiya və Vault Bölməsi -->
            <div class="vault-card">
                <h2 class="section-title">🔐 Məxfi Resept Əlavə Et (Çoxqat Kriptoqrafiya)</h2>
                <input type="text" id="recipeTitle" placeholder="Reseptin Adı (Məs: Şah Pilav)">
                <textarea id="recipeContent" rows="3" placeholder="Gizli Resept Tərkibi və Hazırlanması..."></textarea>
                <input type="password" id="secretKey" placeholder="Məxfi Şifrələmə Açarı (Secret Key)">
                <button class="btn btn-purple" onclick="encryptAndSave()">🔒 AES-256 & SHA-256 ilə Şifrələ və Bazaya Yaz</button>
                
                <div id="cryptoOutput" class="crypto-box" style="display:none;"></div>
            </div>
        </div>

        <!-- Səbət -->
        <div class="cart-card">
            <h2 class="section-title">🛒 Sizin Sifariş</h2>
            <ul class="cart-items" id="cart-list">
                <li style="color: #999; text-align: center;">Səbət boşdur</li>
            </ul>
            <div style="font-weight: bold; text-align: right; margin: 15px 0;">Cəmi: <span id="total-price">0.00</span> AZN</div>
            <button class="btn" style="background:#e67e22;" onclick="checkout()">Sifarişi Təsdiqlə</button>
        </div>
    </div>

    <script>
        // SUPABASE QOŞULMASI (Öz Supabase məlumatlarınla əvəz et)
        const SUPABASE_URL ="https://xqulzoztvhotuduzagcs.supabase.co";
        const SUPABASE_KEY = "sb_publishable_rP5penO5JG-ZihDZZXlO_A_s5JZki_o";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const menuItems = [
            { id: 1, name: "Dadlı Lülə Kabab", price: 8.50, img: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=500&q=80" },
            { id: 2, name: "Məxsuşi Tikə Kabab", price: 9.00, img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=500&q=80" },
            { id: 3, name: "Toyuq Çığırtması", price: 7.00, img: "https://images.unsplash.com/photo-1604908176997-125f2596f3ed?auto=format&fit=crop&w=500&q=80" },
            { id: 4, name: "Paytaxt Salat", price: 4.50, img: "https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=500&q=80" }
        ];

        let cart = [];

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            menuItems.forEach((item, index) => {
                container.innerHTML += `
                    <div class="menu-item" style="animation-delay: ${index * 0.1}s">
                        <img src="${item.img}" alt="${item.name}" class="menu-img">
                        <div class="menu-content">
                            <h3>${item.name}</h3>
                            <div class="price">${item.price.toFixed(2)} AZN</div>
                            <button class="btn" onclick="addToCart(${item.id})">+ Səbətə Əlavə Et</button>
                        </div>
                    </div>`;
            });
        }

        function addToCart(id) {
            cart.push(menuItems.find(p => p.id === id));
            updateCart();
        }

        function updateCart() {
            const list = document.getElementById('cart-list');
            const totalSpan = document.getElementById('total-price');
            if (cart.length === 0) {
                list.innerHTML = '<li style="color: #999; text-align: center;">Səbət boşdur</li>';
                totalSpan.innerText = '0.00';
                return;
            }
            list.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price;
                list.innerHTML += `<li class="cart-item"><span>${item.name}</span><span><b>${item.price.toFixed(2)} AZN</b></span></li>`;
            });
            totalSpan.innerText = total.toFixed(2);
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Səbətiniz boşdur!");
                return;
            }
            alert("🎉 Sifarişiniz uğurla qəbul olundu! Tezliklə hazırlanacaq.");
            cart = [];
            updateCart();
        }

        // İKİQAT KRİPTOQRAFİYA (AES-256 Şifrələmə + SHA-256 Hash Doğrulaması)
        async function encryptAndSave() {
            const title = document.getElementById('recipeTitle').value;
            const content = document.getElementById('recipeContent').value;
            const key = document.getElementById('secretKey').value;

            if (!title || !content || !key) {
                alert("Zəhmət olmasa bütün xanaları doldurun!");
                return;
            }

            // 1-ci Metod: AES-256 ilə Mətnin Şifrələnməsi (Confidentiality)
            const encryptedData = CryptoJS.AES.encrypt(content, key).toString();

            // 2-ci Metod: SHA-256 ilə Açarın/Məlumatın Hash-lənməsi (Integrity verification)
            const keyHash = CryptoJS.SHA256(key).toString();

            const outputDiv = document.getElementById('cryptoOutput');
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = `
                <b>🔐 AES-256 Şifrələnmiş Mətn (Ciphertext):</b><br>${encryptedData}<br><br>
                <b>🛡️ SHA-256 Açarın Hash Dəyəri (Integrity Check):</b><br>${keyHash}
            `;

            // Supabase Verilənlər Bazasına Göndərmə
            try {
                const { data, error } = await supabase
                    .from('recipes')
                    .insert([{ title: title, encrypted_data: encryptedData }]);

                if (error) throw error;
                alert("🔐 Resept uğurla ikiqat kriptoqrafiyadan keçdi və Supabase bazasına yazıldı!");
            } catch (err) {
                console.log("Supabase Xətası:", err.message);
                alert("Kriptoqrafiya uğurla tamamlandı! (Supabase URL və Key koda daxil edildikdən sonra məlumatlar birbaşa bulud bazasına yazılacaq).");
            }
        }

        renderMenu();
    </script>
</body>
</html>
